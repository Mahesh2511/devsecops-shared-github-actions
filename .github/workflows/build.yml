# MOCK of the organization's shared reusable build workflow.
# The real build.yml is private; this implements the interface documented in
# docs/assumptions.md. One workflow serves every artifact type: consumers
# choose with the explicit `artifact_type` input and nothing is inferred.
name: Shared Build

on:
  workflow_call:
    inputs:
      artifact_type:
        description: "backend | frontend. Selects the PR-check rules and the build steps."
        required: true
        type: string
      xml_path:
        description: "Frontend only: XML directory relative to the repo root."
        required: false
        type: string
        default: ""
    outputs:
      result_map:
        description: "JSON result_map produced by the PR-check stage"
        value: ${{ jobs.pr-check.outputs.result_map }}
      block_merge:
        description: "'true' when the PR-check stage blocked the merge"
        value: ${{ jobs.pr-check.outputs.block_merge }}

permissions:
  contents: read

jobs:
  # STAGE 1: PR CHECK. Runs before any build step.
  # A local "./" reference inside a reusable workflow resolves to this shared
  # repository at the same commit as this file, so consumers pinned to @v1 get
  # the matching pr_check.yml.
  pr-check:
    name: PR Check
    uses: ./.github/workflows/pr_check.yml
    with:
      artifact_type: ${{ inputs.artifact_type }}
      xml_path: ${{ inputs.xml_path }}

  # STAGE 2: BUILD. Gated on the PR check.
  # `needs` already skips this job when pr-check fails. The explicit condition
  # also requires block_merge to be literally "false", so nothing short of an
  # explicit pass (not a missing output or an always() added later) lets the build run.
  # Static name on purpose: GitHub doesn't evaluate expressions in the name of a
  # skipped job, and a stable name is needed to use this job as a required check.
  # The artifact type is printed in the "Build context" step instead.
  build:
    name: Build
    needs: pr-check
    if: ${{ needs.pr-check.result == 'success' && needs.pr-check.outputs.block_merge == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build context
        env:
          ARTIFACT_TYPE: ${{ inputs.artifact_type }}
          RESULT_MAP: ${{ needs.pr-check.outputs.result_map }}
        run: |
          echo "artifact_type=$ARTIFACT_TYPE"
          echo "PR checks passed. result_map=$RESULT_MAP"

      # Type-specific build logic lives in the shared build-action, the
      # counterpart of prcheck-utils-action. Referenced by repo + tag for the
      # same reason: a "./" path would resolve against the consumer's checkout.
      - name: Build artifact (build-action)
        uses: Mahesh2511/devsecops-shared-github-actions/actions/build-action@v1
        with:
          artifact_type: ${{ inputs.artifact_type }}
